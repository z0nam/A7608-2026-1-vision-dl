<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" font-family="'Apple SD Gothic Neo','Helvetica Neue',sans-serif">
  <rect width="760" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#333"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#1f6fb2"/>
    </marker>
  </defs>

  <!-- input x -->
  <text x="300" y="40" font-size="22" font-weight="700" text-anchor="middle">입력  x</text>
  <line x1="300" y1="50" x2="300" y2="92" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- main path conv1 -->
  <rect x="180" y="95" width="240" height="56" rx="8" fill="#eaf3fb" stroke="#1f6fb2" stroke-width="2"/>
  <text x="300" y="123" font-size="17" text-anchor="middle">3×3 Conv → BN → ReLU</text>
  <line x1="300" y1="151" x2="300" y2="183" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- main path conv2 -->
  <rect x="180" y="186" width="240" height="56" rx="8" fill="#eaf3fb" stroke="#1f6fb2" stroke-width="2"/>
  <text x="300" y="214" font-size="17" text-anchor="middle">3×3 Conv → BN</text>
  <line x1="300" y1="242" x2="300" y2="300" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="437" y="200" font-size="16" fill="#1f6fb2" font-style="italic">F(x) : 잔차(residual)</text>

  <!-- skip connection -->
  <path d="M300,60 H600 V315 H332" fill="none" stroke="#1f6fb2" stroke-width="2.8" stroke-dasharray="7,5" marker-end="url(#arrowBlue)"/>
  <text x="612" y="190" font-size="16" fill="#1f6fb2" font-weight="700" transform="rotate(90,612,190)">skip connection ( 항등 경로  x )</text>

  <!-- sum node -->
  <circle cx="300" cy="315" r="22" fill="#fff3e0" stroke="#e08a00" stroke-width="2.5"/>
  <text x="300" y="323" font-size="26" text-anchor="middle" fill="#e08a00" font-weight="700">+</text>
  <line x1="300" y1="337" x2="300" y2="378" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- relu -->
  <rect x="222" y="381" width="156" height="48" rx="8" fill="#f1f1f1" stroke="#666" stroke-width="2"/>
  <text x="300" y="411" font-size="17" text-anchor="middle">ReLU</text>
  <line x1="300" y1="429" x2="300" y2="466" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- output -->
  <text x="300" y="500" font-size="22" font-weight="700" text-anchor="middle">출력  H(x) = F(x) + x</text>

  <!-- caption -->
  <text x="300" y="540" font-size="15" text-anchor="middle" fill="#444">그림 1. ResNet 잔차 블록 — 블록은 H(x)가 아니라 잔차 F(x)만 학습하고, 입력 x를 더해 출력한다.</text>
</svg>
